<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>마음안부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2556f">
<meta name="apple-mobile-web-app-title" content="마음안부">
<meta name="application-name" content="마음안부">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 휴대폰 한 줄 화면 — 위 머리글, 가운데 단계별 화면, 아래 메뉴. 넓은 화면은 왼쪽 메뉴 */
:root{
  --bg:#f7f4f3; --surface:#ffffff; --line:#ece4e2; --fg:#221a1c; --muted:#76696c;
  --accent:#d63f5d; --accent-soft:#fde8ec; --on-accent:#ffffff; --sun:#ff9447; --sun-soft:#fff0e3;
  --ok:#2f8a63; --warn:#b5432c; --shade:0 1px 2px rgba(60,20,30,.05),0 6px 18px rgba(60,20,30,.06);
  --grad:linear-gradient(120deg,#ff5e78 0%,#ff8a5c 55%,#ffaa46 100%);
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151112; --surface:#201a1b; --line:#342b2d; --fg:#f3eced; --muted:#a8999c;
  --accent:#ff7d93; --accent-soft:#3a2026; --on-accent:#2a0c12; --sun:#ffab6b; --sun-soft:#3a2a1d; --ok:#6fcf9f; --warn:#f08b72;
  --shade:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151112; --surface:#201a1b; --line:#342b2d; --fg:#f3eced; --muted:#a8999c;
  --accent:#ff7d93; --accent-soft:#3a2026; --on-accent:#2a0c12; --sun:#ffab6b; --sun-soft:#3a2a1d; --ok:#6fcf9f; --warn:#f08b72;
  --shade:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(86px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:600px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* 머리글 */
header{display:flex;align-items:center;gap:10px;padding-block:16px 6px}
header img{width:38px;height:38px;border-radius:10px}
h1{font-family:var(--display);font-size:23px;margin:0;flex:1;letter-spacing:-.01em}
.hbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:17px;flex:none}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 공통 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;text-decoration:none;text-align:center;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.big{padding:14px 18px;font-size:17px;border-radius:14px}
.btn.danger{color:var(--warn)}
.btn.danger-fill{background:var(--warn);border-color:var(--warn);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);margin:8px 0;line-height:1.6}
.sec-t{font-size:18px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t .sub{font-weight:500;margin-left:auto}
input[type=text],input[type=tel],input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
textarea{resize:vertical;min-height:150px;line-height:1.6}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{min-width:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shade)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px;font-weight:600}
.tag.sun{background:var(--sun-soft);color:#b8571a}
.ex{font-size:12px;color:var(--muted);margin-left:6px;border:1px dashed var(--line);border-radius:6px;padding:0 5px}
.empty{padding:30px 18px;text-align:center;color:var(--muted)}
.msg{white-space:pre-wrap;font-size:15px;line-height:1.65;background:var(--bg);border-radius:12px;padding:12px 14px;max-height:9.5em;overflow:auto}

/* 단계 표시 */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.stepper div{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.stepper i{height:5px;border-radius:3px;background:var(--line)}
.stepper .on{color:var(--fg);font-weight:700}
.stepper .on i,.stepper .done i{background:var(--grad)}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 0 2px;display:inline-flex;align-items:center;gap:4px;font-size:15px}

/* 오늘 챙길 고객 */
.today{border-radius:20px;padding:16px;background:var(--grad);color:#fff;display:grid;gap:10px;margin-top:12px}
.today h3{margin:0;font-size:17px;display:flex;align-items:center;gap:6px}
.evrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.95);color:#2a1a1d}
.evrow .ic{font-size:26px;line-height:1}
.evrow b{font-size:17px}
.evrow .lb{font-size:14px;color:#8a5a62;display:block}
.evrow .go{margin-left:auto;font-weight:700;color:#d63f5d;font-size:15px;white-space:nowrap}
.week{margin-top:10px}
.week summary{list-style:none;cursor:pointer;font-size:15px;color:var(--muted);padding:8px 2px;display:flex;align-items:center;gap:6px}
.week summary::-webkit-details-marker{display:none}
.week summary::after{content:"›";margin-left:auto;font-size:20px;transition:transform .2s}
.week[open] summary::after{transform:rotate(90deg)}
.week .evrow{background:var(--surface);border:1px solid var(--line);color:var(--fg);margin-top:8px}
.week .evrow .lb{color:var(--muted)}
.week .evrow .go{color:var(--accent)}

/* 고객 고르기 */
.pick{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:0}
.pick .who{flex:1;min-width:0}
.pick b{font-size:17px}
.pick.on{background:var(--accent-soft)}
.list{overflow:hidden}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.selall{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 2px 10px}

/* 아래 고정 버튼 */
.actionbar{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));margin-top:18px;display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 18px;box-shadow:0 8px 28px rgba(60,20,30,.14);z-index:5}
.actionbar .sub{flex:1}
.actionbar b{color:var(--fg);font-size:17px}

/* 문구 고르기 */
.opts{display:grid;gap:12px}
.opt{display:grid;gap:10px;padding:14px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);text-align:left;cursor:pointer}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.opt-h{display:flex;align-items:center;gap:10px}
.opt-h b{font-size:16px;flex:1;min-width:0}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--accent);background:var(--accent)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.months button{flex:none;width:46px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.months button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

/* 보내기 */
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--grad);transition:width .3s}
.nextcard{padding:18px;display:grid;gap:12px;border:1.5px solid var(--accent)}
.nextcard .lbl{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.nextcard .msg{max-height:none;background:var(--bg)}
.qrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .who{flex:1;min-width:0}
.qrow.done .who b{color:var(--muted)}
.ok{color:var(--ok);font-weight:600;font-size:14px;white-space:nowrap}
.links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.links button{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.donebox{text-align:center;padding:26px 18px;display:grid;gap:10px;justify-items:center}
.donebox .big{font-size:44px;line-height:1}

/* 고객·인사말 관리 */
.item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .who{flex:1;min-width:0}
.memo{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.grp{font-size:13px;font-weight:700;color:var(--muted);padding:14px 16px 6px;background:var(--bg);letter-spacing:.03em}

/* 설정 */
.set{padding:4px 16px}
.set>.srow{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.set>.srow:first-child{border-top:0}
.srow .t{flex:1;min-width:0}
.srow .t div:first-child{font-weight:600}

/* 안내 */
.guide{display:grid;gap:10px}
.guide details{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.guide summary{padding:16px;font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"＋";margin-left:auto;color:var(--accent);font-size:18px}
.guide details[open] summary::after{content:"－"}
.guide .body{padding:0 16px 16px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:st}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.65}
.steps li::before{counter-increment:st;content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.steps li b{color:var(--accent)}
.faq p{margin:0 0 4px;font-weight:700}
.faq div{font-size:15px;color:var(--muted);line-height:1.65;margin-bottom:14px}
.hero{background:var(--grad);color:#fff;border-radius:18px;padding:18px;display:grid;gap:6px}
.hero h3{margin:0;font-family:var(--display);font-size:21px}
.hero p{margin:0;font-size:15px;line-height:1.65}
.mini{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:14px;background:var(--bg);color:var(--fg);font-weight:500}

/* 업데이트 알림 */
.upd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--fg);color:var(--bg);border-radius:16px;padding:12px 14px;margin:6px 0}
.upd .btn{background:var(--bg);color:var(--fg);border-color:var(--bg)}

/* 아래 메뉴 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:10}
nav.tabs button{flex:1;background:none;border:0;padding:7px 2px;border-radius:12px;font-size:12.5px;min-width:0;color:var(--muted);display:grid;justify-items:center;gap:3px;white-space:nowrap}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}

/* 아래에서 올라오는 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(20,8,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:19px}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* 화면 크기·방향 */
@media (min-width:700px){
  .wrap{max-width:780px}
  .sheet-bg{align-items:center;padding:24px}
  .sheet{border-radius:22px;max-height:88vh;max-width:620px;padding:24px 26px}
  .opts{grid-template-columns:1fr 1fr}
}
@media (min-width:960px){
  .wrap{max-width:1080px}
  body{padding-left:calc(100px + max(28px,env(safe-area-inset-left,0px)));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:0 32px}
  nav.tabs{top:0;bottom:0;right:auto;width:calc(100px + env(safe-area-inset-left,0px));flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);
    padding:calc(84px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex:none;padding:12px 4px;font-size:13px}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft)}
  .actionbar{bottom:20px}
  .toast{bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .opts{grid-template-columns:1fr 1fr 1fr}
  .two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
}
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:0 calc(60px + env(safe-area-inset-bottom,0px))}
  header{padding-block:8px 2px}
  nav.tabs button{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 4px}
  nav.tabs svg{width:20px;height:20px}
  .actionbar{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  .sheet-bg{align-items:center;padding:8px}
  .sheet{border-radius:18px;max-height:calc(100% - 8px)}
  .toast{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
}
@media (orientation:landscape) and (max-height:520px) and (min-width:960px){
  nav.tabs button{flex-direction:column;gap:2px}
  .actionbar{bottom:12px}
}
html.big .wrap,html.big nav.tabs,html.big .sheet{zoom:1.15}

<script>
(function(){
const KEY='greeting-sender-v1';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=p=>String(p||'').replace(/\D/g,'').replace(/^82(?=1)/,'0');
const fmt=p=>{const d=digits(p);if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');if(d.length===10)return d.replace(/(\d{2,3})(\d{3,4})(\d{4})/,'$1-$2-$3');return d;};
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

const CATS=['월별 인사','명절','생일','결혼기념일','감사','위로·안내'];
const M=(m,k,name,body)=>({id:'m'+m+k,cat:'월별 인사',m,name:m+'월 · '+name,body});
const BASE_TPLS=[
  M(1,'a','새해 소망','새해가 밝았어요^^ 새 달력을 걸며 올해는 어떤 좋은 일들이 찾아올지 벌써 마음이 설레네요. 마음에 품은 소망들이 하나하나 이루어지는 뿌듯한 한 해 되길 바랄게요. 새해 복 많이 받으세요!'),
  M(1,'b','새해 건강','한 해의 첫 달, 1월이에요. 새해 계획도 중요하지만 무엇보다 건강이 먼저인 것 같아요. 매서운 추위에 몸이 움츠러드는 요즘, 따뜻하게 챙겨 입고 식사도 든든히 하면서 활기찬 1월 보내길 바랄게요~ 올해도 잘 부탁드려요^^'),
  M(1,'c','새해 다짐','새로운 시작은 언제나 가슴을 두근거리게 하지요. 작심삼일이 되어도 괜찮아요. 삼일마다 다시 마음먹으면 일 년 내내 새 출발이니까요^^ 올 한 해 웃을 일 가득하고 하는 일마다 술술 풀리길 바랄게요. 새해 복 많이 받으세요!'),
  M(1,'d','한파','동장군의 기세가 대단한 1월이에요. 이렇게 추운 날엔 따끈한 차 한 잔이 큰 위로가 되는 것 같아요. 빙판길 조심하시고, 감기 걸리지 않게 건강 잘 챙기면서 포근한 겨울 보내길 바래요~'),
  M(2,'a','입춘 설렘','2월이에요. 아직 바람은 차갑지만 입춘이 지나면 어딘가에서 봄이 조용히 준비를 하고 있겠지요^^ 다가올 봄을 기다리는 설렘으로 하루하루 즐겁게 보내길 바랄게요. 남은 겨울도 건강하게 지내요~'),
  M(2,'b','짧은 2월','일 년 중 가장 짧은 달, 2월이에요. 짧은 만큼 하루하루가 더 소중하게 느껴지네요. 새해 다짐이 조금 흐려졌다면 다시 마음을 다잡기 좋은 때인 것 같아요. 알차고 따뜻한 2월 되길 바랄게요^^'),
  M(2,'c','새 출발','졸업과 새 출발이 함께하는 2월이에요. 끝은 또 다른 시작이라는 말처럼 마무리와 설렘이 함께하는 달인 것 같아요. 주변에 축하할 일이 많은 이달, 기분 좋은 소식 가득하길 바랄게요~'),
  M(2,'d','겨울 끝자락','겨울의 끝자락, 2월이에요. 일교차가 커지는 요즘은 면역력이 떨어지기 쉽다고 하니 충분히 쉬고 잘 챙겨 드세요. 곧 찾아올 봄을 건강하게 맞이할 수 있도록 오늘도 힘내요^^'),
  M(3,'a','봄의 시작','드디어 봄의 문을 여는 3월이에요^^ 아직 꽃샘추위가 심술을 부리지만 햇살만큼은 확실히 달라진 것 같아요. 새봄의 기운을 듬뿍 받아 활기차고 신나는 3월 되길 바랄게요~'),
  M(3,'b','새 학기','새 학기, 새 출발의 3월이에요. 무언가를 새로 시작하기에 참 좋은 계절이지요. 마음에 담아 두었던 일이 있다면 이번 봄엔 가볍게 첫걸음 떼어 보는 건 어떨까요? 늘 응원할게요^^'),
  M(3,'c','꽃샘추위','봄이 왔다고 방심하기엔 아직 꽃샘추위가 매서운 3월이에요. 얇은 겉옷 하나 꼭 챙기시고, 물 자주 드시면서 환절기 건강 잘 지켜요~ 따스한 봄볕 같은 하루하루 되길 바래요^^'),
  M(3,'d','봄바람','살랑살랑 봄바람이 마음까지 간지럽히는 3월이에요. 길가에 하나둘 피어나는 꽃처럼 좋은 일들이 차례차례 피어나는 한 달 되길 바랄게요. 오늘도 미소 가득한 하루 보내요~'),
  M(4,'a','벚꽃','꽃비가 내리는 4월이에요^^ 바쁜 일상이지만 잠시 고개 들어 흩날리는 벚꽃 한번 바라보는 여유 가져 보세요. 봄은 짧아서 더 아름다운 것 같아요. 행복한 봄날 마음껏 누리길 바랄게요~'),
  M(4,'b','긍정의 봄','꽃이 피는 데에도 저마다의 때가 있다고 하지요. 지금 조금 더디게 느껴지는 일도 곧 활짝 피어날 거예요^^ 생동하는 4월의 기운처럼 늘 긍정적인 마음으로 힘차게 보내길 바랄게요!'),
  M(4,'c','봄나들이','나들이하기 딱 좋은 4월이에요. 가까운 공원이라도 소중한 분들과 함께 걸으며 봄 내음 가득 느껴 보는 건 어떨까요? 큰 일교차와 미세먼지는 조심하시고요~ 건강하고 즐거운 봄 되세요^^'),
  M(4,'d','봄 나른함','따스한 햇살에 자꾸만 눈꺼풀이 무거워지는 4월이에요^^ 봄철 나른함은 가벼운 스트레칭과 제철 나물로 이겨 내 보세요. 활력 넘치는 봄날 되길 바랄게요~'),
  M(5,'a','가정의 달','감사할 일이 참 많은 가정의 달 5월이에요. 늘 곁에 있어 당연하게 느꼈던 가족에게 오늘은 ‘고마워’, ‘사랑해’ 한마디 건네 보는 건 어떨까요? 웃음 가득한 따뜻한 5월 되길 바랄게요^^'),
  M(5,'b','신록','초록이 하루가 다르게 짙어 가는 5월이에요. 싱그러운 신록처럼 마음에도 생기가 가득 차오르길 바랄게요. 계절이 주는 선물을 마음껏 누리는 여유로운 한 달 보내요~'),
  M(5,'c','어버이날','카네이션이 곳곳에 피어나는 5월이에요. 부모님 생각에 마음이 더 뭉클해지는 달이지요. 소중한 분들과 따뜻한 시간 많이 나누시고, 본인 건강도 꼭 챙기는 5월 되길 바래요^^'),
  M(5,'d','봄의 절정','봄의 절정에 선 5월이에요^^ 날씨가 좋아 바깥 활동이 많아지는 만큼 무리하지 말고 쉬엄쉬엄 하세요. 일과 쉼의 균형이 딱 맞는 행복한 하루하루 되길 바랄게요~'),
  M(6,'a','초여름','어느새 반팔이 어색하지 않은 6월이에요. 한 해의 절반을 지나는 지금, 잘 달려온 나에게 칭찬 한마디 해 주는 건 어떨까요? 남은 절반도 지금처럼 멋지게 해낼 거예요^^ 시원하고 상쾌한 6월 되세요~'),
  M(6,'b','반환점','올해의 반환점, 6월이에요. 연초에 세운 계획들을 한번 돌아보고 다시 힘을 내기 좋은 때인 것 같아요. 여름 햇살처럼 밝고 힘찬 날들 이어지길 바랄게요!'),
  M(6,'c','더위 대비','하루가 다르게 기온이 올라가는 6월이에요. 본격적인 더위가 오기 전 체력 관리가 중요하다고 하지요. 물 자주 마시고, 잠 충분히 자면서 올여름도 건강하게 이겨 내길 바래요^^'),
  M(6,'d','감사','호국보훈의 달 6월이에요. 우리가 누리는 평범한 일상이 누군가의 헌신 덕분이라는 걸 다시 생각하게 되네요. 오늘 하루도 감사한 마음으로 웃음 가득한 날 되길 바랄게요~'),
  M(7,'a','여름휴가','여름휴가가 기다려지는 7월이에요^^ 바쁘게 달려온 상반기, 이번 여름엔 잠시 쉼표를 찍고 몸과 마음을 충전하는 시간 꼭 가지세요. 즐겁고 안전한 여름 보내길 바랄게요~'),
  M(7,'b','장마','장맛비가 오락가락하는 7월이에요. 눅눅한 날씨에 몸도 마음도 처지기 쉬운데 이럴 때일수록 환기 자주 하시고 음식 위생도 꼼꼼히 챙기세요. 빗소리마저 정겹게 느껴지는 여유로운 날 되길 바래요^^'),
  M(7,'c','하반기 시작','하반기의 첫 달, 7월이에요. 남은 반년은 지난 반년보다 조금 더 웃고, 조금 덜 걱정하는 시간이었으면 좋겠어요^^ 뜨거운 여름만큼 열정 가득한 날들 되길 바랄게요!'),
  M(7,'d','복날','본격적인 무더위가 시작되는 7월이에요. 복날엔 맛있는 보양식 챙겨 드시고, 냉방병도 조심하세요~ 시원한 수박 한 조각처럼 상쾌한 하루하루 되길 바랄게요^^'),
  M(8,'a','한여름','뜨거운 태양이 한가운데 떠 있는 8월이에요. 무더위에 지치지 않도록 틈틈이 쉬어 가며 건강 잘 챙기세요. 여름이 끝날 때까지 늘 시원하고 기분 좋은 날만 가득하길 바랄게요^^'),
  M(8,'b','여름 끝자락','여름의 끝자락이 보이는 8월이에요. 아침저녁으로 살짝 선선한 바람이 불 때면 가을이 멀지 않았다는 생각에 괜히 설레네요^^ 남은 여름도 알차고 행복하게 보내요~'),

function givenName(n){n=String(n||'').trim();if(/^[가-힣]{3,4}$/.test(n))return n.slice(1);return n;}
/* 연락처 이름에서 사람 이름만 골라내기: 나머지는 호칭·메모로 */
const SURN='김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허남심노하곽성차주우구민진나지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용예봉경사부가복태목형피두감음빈동온호범좌팽승간상갈시화';
const SURN2=['남궁','황보','제갈','선우','독고','사공','서문','동방'];
const TITLES=['고객님','고객','사장님','대표님','원장님','선생님','교수님','이사님','부장님','과장님','차장님','팀장님','실장님','본부장님','여사님','어머님','아버님','언니','오빠','누나','형님','이모','삼촌','님','씨',
  '사장','대표','원장','선생','교수','이사','부장','과장','차장','팀장','실장','본부장','여사'].sort((a,b)=>b.length-a.length);
const ORG=/(생명|화재|손보|보험|은행|증권|카드|병원|의원|약국|회사|상사|학교|센터|마트|식당|부동산|교회|성당|협회|주식|지점|본점|공단)/;
const NOUN=/^(사무실|사무소|거래처|매장|가게|동창|친구|동네|아파트|헬스|학원|모임|회장|총무|기사|사모|사모님|고객|지인|소개|가족|강남|강북|강서|강동|서울|부산|대구|인천|광주|대전|울산|세종|수원|분당|일산|성남|용인|안양|부천|제주|신규|기존|만기|실손|암보험|종신|연금|자동차)$/;
function smartName(raw){
  let s=String(raw||'').normalize('NFC');const memoParts=[];
  s=s.replace(/[(\[{<（【「](.*?)[)\]}>）】」]/g,(m,inner)=>{if(inner.trim())memoParts.push(inner.trim());return ' '});
  s=s.replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
  const toks=s.split(' ').filter(Boolean);
  const strip=t=>{for(const ti of TITLES){if(t.length>ti.length+1&&t.endsWith(ti))return[t.slice(0,-ti.length),ti]}return[t,''];};
  const isSur=b=>b.length===4?SURN2.includes(b.slice(0,2)):SURN.includes(b[0]);
  const cands=toks.map((t,i)=>{const[b,ti]=strip(t);return{i,b,ti,t}}).filter(x=>/^[가-힣]{2,4}$/.test(x.b)&&!ORG.test(x.t)&&!NOUN.test(x.b)&&!TITLES.includes(x.t));
  const c=cands.find(x=>x.b.length===3&&isSur(x.b))||cands.find(x=>x.b.length===2&&isSur(x.b))||cands.find(x=>x.b.length===4&&isSur(x.b))||cands[0];
  if(!c)return{name:cleanName(raw)||String(raw||'').trim(),title:'',memo:''};
  let title=c.ti;const rest=toks.filter((_,i)=>i!==c.i);
  const ti2=rest.findIndex(t=>TITLES.includes(t));if(!title&&ti2>=0){title=rest[ti2];rest.splice(ti2,1)}
  if(['고객님','고객','님','씨'].includes(title))title='';
  if(/(사장|대표|원장|선생|교수|이사|부장|과장|차장|팀장|실장|본부장|여사)$/.test(title))title+='님';
  return{name:c.b,title,memo:[...rest,...memoParts].join(' ').trim()};
}
function cleanName(n){return String(n||'').replace(/\(.*?\)|\[.*?\]|<.*?>/g,' ').replace(/\s*(고객님|고객|님)$/,'').replace(/\s+/g,' ').trim();}
function monthNow(){const d=new Date();return d.getDate()>=25?(d.getMonth()+1)%12+1:d.getMonth()+1}
function compose(body){let b=String(body||'');
  if(S.prefix!==false&&!/\{이름(만)?\}/.test(b))b='{이름} {호칭}~\n'+b;
  if(S.sign!==false&&S.me&&!/\{설계사\}/.test(b))b+='\n\n- {설계사} 드림';return b;}
function fill(body,c){c=c||{name:'홍길동',title:''};
  return compose(body).replace(/\{이름\}/g,c.name).replace(/\{이름만\}/g,givenName(c.name)).replace(/\{호칭\}/g,c.title||S.defTitle||'고객님')
    .replace(/\{월\}/g,monthNow()).replace(/\{설계사\}/g,S.me||'담당 설계사');}
function daysTo(v){if(!/^\d{2}-\d{2}$/.test(v||''))return null;const [m,d]=v.split('-').map(Number);
  const t=new Date();t.setHours(0,0,0,0);let b=new Date(t.getFullYear(),m-1,d);if(b<t)b=new Date(t.getFullYear()+1,m-1,d);return Math.round((b-t)/864e5);}
const dLabel=n=>n===0?'오늘':n===1?'내일':`${n}일 후`;
const mdText=v=>v?`${+v.slice(0,2)}/${+v.slice(3)}`:'';
function parseBday(v){v=String(v||'').trim();let m=v.match(/^(?:\d{4}|--)?[-./ ]?(\d{1,2})[-./ 월]\s*(\d{1,2})/)||v.match(/^(?:\d{4}|--)(\d{2})(\d{2})$/)||v.match(/^(\d{2})(\d{2})$/);
  if(!m)return '';const mo=+m[1],d=+m[2];if(mo<1||mo>12||d<1||d>31)return '';return `${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function qpDecode(s){const bytes=[];for(let i=0;i<s.length;i++){if(s[i]==='='&&/[0-9A-F]{2}/i.test(s.substr(i+1,2))){bytes.push(parseInt(s.substr(i+1,2),16));i+=2}else bytes.push(s.charCodeAt(i)&255)}
  try{return new TextDecoder('utf-8').decode(new Uint8Array(bytes))}catch(e){return s}}
function parseVcf(text){
  text=text.replace(/=\r?\n/g,'').replace(/\r?\n[ \t]/g,'');
  return text.split(/BEGIN:VCARD/i).slice(1).map(card=>{let fn='',n='',tels=[],bday='',anniv='';
    card.split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i<0)return;const k=l.slice(0,i).toUpperCase(),v=l.slice(i+1);
      const val=(k.includes('QUOTED-PRINTABLE')?qpDecode(v):v).replace(/\\,/g,',').replace(/\\;/g,';');const base=k.split(';')[0].replace(/^ITEM\d+\./,'');
      if(base==='FN')fn=val.trim();
      else if(base==='N'){const p=val.split(';');n=((p[0]||'')+(p[1]||'')).trim()}
      else if(base==='TEL')tels.push({cell:/CELL|MOBILE/.test(k),v:val});
      else if(base==='BDAY')bday=parseBday(val);
      else if(/^(X-)?ANNIVERSARY$|^X-ABDATE$/.test(base))anniv=anniv||parseBday(val);});
    const t=tels.find(t=>t.cell&&/^01/.test(digits(t.v)))||tels.find(t=>/^01/.test(digits(t.v)))||tels[0];
    return{name:cleanName(fn||n),raw:fn||n,phone:t?t.v:'',bday,anniv};});}

/* 2. 문구 */

  const cats=[['rec','✨ 추천'],['월별 인사','월별'],['명절','명절'],['생일','생일'],['결혼기념일','결혼기념일'],['감사','감사'],['위로·안내','위로·안내'],['mine','내가 만든']]
    .filter(([k])=>k==='rec'||(k==='mine'?S.templates.some(isMine):S.templates.some(t=>t.cat===k)));
  const cat=cats.some(([k])=>k===S.flow.cat)?S.flow.cat:'rec';S.flow.cat=cat;
  const m=S.flow.m||monthNow();

    head=`<div class="row between" style="margin:4px 0 10px"><span class="sub">${hol?`${esc(hol.name)}(${hol.date.getMonth()+1}/${hol.date.getDate()})가 다가와요 · `:''}${monthNow()}월에 어울리는 문구예요</span><button class="btn small" id="more">🔄 다른 문구</button></div>`;}
  else if(cat==='월별 인사'){list=S.templates.filter(t=>t.cat===cat&&t.m===m);
    head=`<div class="months">${[...Array(12)].map((_,i)=>`<button data-m="${i+1}" aria-pressed="${i+1===m}">${i+1}월</button>`).join('')}</div>`;}
  else if(cat==='mine')list=S.templates.filter(isMine);
  else list=S.templates.filter(t=>t.cat===cat);
  if(!curTpl()&&list[0])S.tplId=list[0].id;
  const who=rs.length===1?`${esc(rs[0].name)} 님`:`${esc(rs[0].name)} 님 외 ${rs.length-1}명`;
  $('#p-send').innerHTML=`${stepper(2)}
    <button class="back" id="b1">‹ 받는 분 다시 고르기</button>
    <div class="sec-t" style="margin-top:6px">어떤 문구를 보낼까요?<span class="sub">${who}</span></div>
    <div class="chips" id="scats">${cats.map(([k,l])=>`<button class="chip" data-c="${k}" aria-pressed="${k===cat}">${l}</button>`).join('')}</div>
    ${head}
    <div class="opts">${list.length?list.map(t=>`<div class="opt ${t.id===S.tplId?'on':''}" data-t="${t.id}" role="radio" tabindex="0" aria-checked="${t.id===S.tplId}">
      <div class="opt-h"><span class="radio"></span><b>${esc(t.gen?'자동으로 만든 문구':t.name)}</b>${t.gen?'<span class="tag sun">자동 생성</span>':''}</div>
      <div class="msg">${esc(fill(t.body,sample))}</div>
      ${t.gen?`<div><button class="btn small" data-keep="${t.id}">내 인사말에 저장</button></div>`:''}</div>`).join(''):'<div class="card empty">이 분류에는 인사말이 없어요</div>'}</div>
    <div class="actionbar"><span class="sub">${curTpl()?`<b>${esc(curTpl().gen?'자동 문구':curTpl().name)}</b>`:'문구를 골라 주세요'}</span><button class="btn primary big" id="to3" ${curTpl()?'':'disabled'}>다음: 보내기 →</button></div>`;
  $('#b1').onclick=()=>goStep(1);
  $$('#scats .chip').forEach(b=>b.onclick=()=>{S.flow.cat=b.dataset.c;save();step2()});
  $$('.months button').forEach(b=>b.onclick=()=>{S.flow.m=+b.dataset.m;save();step2()});
  const mo=$('#more');if(mo)mo.onclick=()=>{const was=S.rec.ids.includes(S.tplId);makeRec();if(was)S.tplId=S.rec.ids[0];save();step2()};
  $$('.opt').forEach(o=>{const pickIt=()=>{S.tplId=o.dataset.t;save();step2()};o.onclick=e=>{if(e.target.closest('[data-keep]'))return;pickIt()};o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pickIt()}}});
  $$('[data-keep]').forEach(b=>b.onclick=()=>{const g=S.rec.gen.find(x=>x.id===b.dataset.keep);if(!g)return;
    const n={id:uid(),cat:'월별 인사',m:g.m,name:g.m+'월 · 내가 고른 문구',body:g.body};S.templates.push(n);
    if(S.tplId===g.id)S.tplId=n.id;S.rec.ids=S.rec.ids.map(i=>i===g.id?n.id:i);save();step2();toast('인사말 탭에 저장했어요')});
  $('#to3').onclick=()=>{if(curTpl())goStep(3)};

/* 3. 보내기 */
function smsHref(phone,text){const n=digits(phone);const b=encodeURIComponent(text);return isIOS?`sms:${n}&body=${b}`:`sms:${n}?body=${b}`;}
const stamp=()=>{const d=new Date();return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
function markSent(id){S.sent[sentKey(S.tplId,id)]=stamp();save();setTimeout(()=>{if(tab==='send'&&S.flow.step===3)step3()},400)}
function step3(){
  const t=curTpl(),rs=S.selected.map(byId).filter(Boolean);
  const done=rs.filter(c=>S.sent[sentKey(t.id,c.id)]),next=rs.find(c=>!S.sent[sentKey(t.id,c.id)]);

    ${next?`<div class="card nextcard" style="margin-top:12px">

      <div><b style="font-size:20px">${esc(next.name)}</b>${next.title?` <span class="sub">${esc(next.title)}</span>`:''}<div class="sub">${esc(fmt(next.phone))}${next.memo?` · 📝 ${esc(next.memo)}`:''}</div></div>
      <div class="msg">${esc(fill(t.body,next))}</div>
      <a class="btn primary big" id="sendNext" href="${smsHref(next.phone,fill(t.body,next))}">💌 ${esc(next.name)} 님께 문자 보내기</a>
      <div class="links"><button id="cpMsg">문구 복사</button><button id="cpNum">번호 복사</button></div>
    </div>
    <p class="note">문자앱이 열리면 <b>전송</b>을 누르고, 뒤로 가기로 돌아오세요. 다음 분이 바로 나와요.</p>`
    :`<div class="card donebox" style="margin-top:12px"><div class="big">👏</div><b style="font-size:20px">${rs.length}명에게 모두 보냈어요</b>
      <div class="sub">수고하셨어요!</div><button class="btn primary big" id="restart" style="margin-top:6px">처음 화면으로</button></div>`}
    <div class="sec-t" style="font-size:16px">받는 분 목록</div>
    <div class="card list">${rs.map(c=>{const st=S.sent[sentKey(t.id,c.id)];return `<div class="qrow ${st?'done':''}">
      <span class="who"><b>${esc(c.name)}</b> <span class="sub">${esc(fmt(c.phone))}</span></span>
      ${st?`<span class="ok">✓ ${st} 보냄</span>`:''}
      <a class="btn small" data-send="${c.id}" href="${smsHref(c.phone,fill(t.body,c))}">${st?'다시':'보내기'}</a></div>`}).join('')}</div>
    ${done.length?'<div style="text-align:center;margin-top:10px"><button class="btn small ghost" id="resetSent">보낸 표시 지우기</button></div>':''}`;
  $('#b2').onclick=()=>goStep(2);
  if(next){$('#sendNext').onclick=()=>markSent(next.id);
    $('#cpMsg').onclick=()=>{copy(fill(t.body,next),'문구를 복사했어요');markSent(next.id)};
    $('#cpNum').onclick=()=>copy(digits(next.phone),'번호를 복사했어요');}
  else $('#restart').onclick=()=>{S.selected=[];S.flow={step:1,cat:'rec'};save();goStep(1)};
  $$('[data-send]').forEach(a=>a.onclick=()=>markSent(a.dataset.send));
  const rb=$('#resetSent');if(rb)rb.onclick=()=>confirmBox('보낸 표시를 지울까요?','처음부터 다시 보낼 수 있어요. 이미 보낸 문자는 취소되지 않아요.','네, 지울게요',
    ()=>{rs.forEach(c=>delete S.sent[sentKey(t.id,c.id)]);save();step3()});
}

function addMany(list,tag){let added=0,skipped=0,updated=0;const have=new Map(S.customers.map(c=>[digits(c.phone),c]));
  list.forEach(({name,phone,bday,anniv,title,memo})=>{const d=digits(phone);if(!name||d.length<9){skipped++;return}
    const ex=have.get(d);if(ex){let u=false;if(bday&&!ex.bday){ex.bday=bday;u=true}if(anniv&&!ex.anniv){ex.anniv=anniv;u=true}u?updated++:skipped++;return}
    const n={id:uid(),name,phone:fmt(d),title:title||'',tag:tag||'',bday:bday||'',anniv:anniv||'',memo:memo||''};have.set(d,n);S.customers.push(n);added++;});
  save();render();toast(`${added}명 추가했어요${updated?` · ${updated}명 기념일 보완`:''}${skipped?` · ${skipped}건은 이미 있어요`:''}`);}

$('#importBtn').onclick=()=>sheet(`<h3>휴대폰 연락처에서 불러오기</h3>
  ${canPick?`<button class="btn primary big" id="pickC" style="width:100%;margin:8px 0 4px">📱 연락처에서 바로 고르기</button>
  <p class="note" style="margin-top:4px">연락처 화면이 열리면 고객을 골라 ‘완료’를 누르세요. 새로 저장한 연락처를 하나씩 추가할 때 편해요.</p>
  <div class="sub" style="margin:18px 0 6px;font-weight:600">또는 연락처 파일로 한꺼번에</div>`:''}
  <p class="note">연락처를 파일(.vcf)로 내보낸 뒤, 아래에서 그 파일을 고르세요. <b>이미 있는 고객은 자동으로 빼고 새 연락처만</b> 보여 드려요. 연락처가 늘었을 때 다시 불러오면 돼요.</p>
  <div class="card" style="padding:14px;display:grid;gap:6px;font-size:15px;box-shadow:none">
    <div><b>갤럭시</b>: 연락처 앱 → ☰ → 연락처 관리 → 가져오기/내보내기 → 내보내기</div>
    <div><b>아이폰</b>: 연락처 앱 → 목록 길게 누르기 → 내보내기 → 파일에 저장</div></div>
  <label class="btn ${canPick?'':'primary '}big" style="width:100%;margin-top:14px" for="vcf">📂 연락처 파일 고르기</label>
  <input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard" hidden>
  <details style="margin-top:16px"><summary class="sub" style="cursor:pointer">목록을 붙여넣어 추가하기</summary>
    <p class="note">한 줄에 한 명씩 ‘이름 전화번호’ (엑셀에서 복사해도 돼요)</p>
    <textarea id="paste" style="min-height:100px" placeholder="홍길동 010-1234-5678&#10;김영희, 01098765432"></textarea>
    <div class="row" style="margin-top:8px"><input type="text" id="pasteTag" class="grow" placeholder="그룹 이름(선택)"><button class="btn" id="pasteBtn">추가하기</button></div>
  </details>`,()=>{
  const pc=$('#pickC');if(pc)pc.onclick=async()=>{try{
      const got=await navigator.contacts.select(['name','tel'],{multiple:true});
      const list=[];(got||[]).forEach(c=>{const nm=(c.name||[])[0]||'';const tels=(c.tel||[]);const t=tels.find(x=>/^01/.test(digits(x)))||tels[0];if(nm&&t)list.push({name:nm,raw:nm,phone:t,bday:'',anniv:''})});
      if(!list.length){toast('고른 연락처가 없어요');return}previewImport(list,true);
    }catch(e){toast('연락처를 열지 못했어요. 연락처 파일로 불러와 주세요')}};
  $('#vcf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const list=parseVcf(r.result);if(!list.length){toast('연락처를 찾지 못했어요. .vcf 파일이 맞는지 확인해 주세요');return}previewImport(list)};r.readAsText(f);};
  $('#pasteBtn').onclick=()=>{const rows=$('#paste').value.split(/\n/).map(l=>{const m=l.match(/(\+?82[\s-]?1\d|01\d)[\s.-]?\d{3,4}[\s.-]?\d{4}/);
    if(!m)return null;const sm=smartName(l.replace(m[0],'').replace(/[,\t|;]+/g,' '));return{...sm,phone:m[0]}}).filter(Boolean);
    if(!rows.length){toast('전화번호가 있는 줄을 찾지 못했어요');return}const tg=$('#pasteTag').value.trim();closeSheet();addMany(rows,tg);};
});
function previewImport(list,preChecked){
  const have=new Set(S.customers.map(c=>digits(c.phone)));
  const ok=list.filter(x=>(x.raw||x.name)&&digits(x.phone).length>=9).map(x=>({...x,sm:smartName(x.raw||x.name),plain:cleanName(x.raw||x.name)||x.raw,dup:have.has(digits(x.phone))}));
  const nNew=ok.filter(x=>!x.dup).length,nDup=ok.length-nNew;
  if(!nNew){toast(`${ok.length}명 모두 이미 고객 목록에 있어요`);return}
  let smart=true,showDup=false;
  const out=x=>smart?{...x,name:x.sm.name,title:x.sm.title,memo:x.sm.memo}:{...x,name:x.plain,title:'',memo:''};
  const rowHtml=(x,i)=>{const o=out(x);const changed=smart&&(o.name!==x.raw);
    return `<label class="pick" data-row="${i}"><input type="checkbox" data-i="${i}"><span class="who"><b>${esc(o.name)}</b>${o.title?` <span class="sub">${esc(o.title)}</span>`:''}
    ${changed?`<span class="sub" style="display:block">원래 이름: ${esc(x.raw)}</span>`:''}${o.memo?`<span class="sub" style="display:block">📝 메모로: ${esc(o.memo)}</span>`:''}
    <span class="sub" style="display:block">${esc(fmt(x.phone))}${x.bday?` · 생일 ${mdText(x.bday)}`:''}${x.anniv?` · 결혼 ${mdText(x.anniv)}`:''}</span></span></label>`;};
  sheet(`<h3>새 연락처 ${nNew}명을 찾았어요</h3><p class="note" style="margin-bottom:10px">${nDup?`이미 고객 목록에 있는 ${nDup}명은 뺐어요. `:''}고객만 골라서 추가하세요.</p>
    <label class="selall" style="background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:10px"><input type="checkbox" id="i-smart" checked>
      <span><b>이름만 남기기</b><span class="sub" style="display:block">‘김민수 삼성 부장’ → 이름 ‘김민수’, 호칭 ‘부장님’, 나머지는 메모로</span></span></label>
    <input type="search" id="i-q" placeholder="이름 검색" style="margin-bottom:8px">
    <div class="row between" style="margin:4px 0 8px"><label class="selall" style="padding:0"><input type="checkbox" id="i-all"> 모두 선택</label>
      <input type="text" id="i-tag" style="max-width:50%" placeholder="그룹(선택)"></div>
    <div class="card list" id="i-list" style="max-height:44vh;overflow:auto;box-shadow:none"></div>
    <div class="sheet-actions"><button class="btn big" id="i-cancel">취소</button><button class="btn big primary" id="i-ok">추가하기</button></div>`,()=>{
    const checked=new Set(preChecked?ok.map((x,i)=>x.dup?-1:i).filter(i=>i>=0):[]);
    const cnt=()=>{const n=checked.size;$('#i-ok').textContent=n?`${n}명 추가하기`:'추가하기'};
    const draw=()=>{const q=$('#i-q').value.trim();
      $('#i-list').innerHTML=ok.map((x,i)=>({x,i})).filter(({x})=>!x.dup).filter(({x})=>!q||out(x).name.includes(q)||String(x.raw).includes(q)).map(({x,i})=>rowHtml(x,i)).join('')||'<div class="empty">찾는 이름이 없어요</div>';
      $$('#i-list [data-i]').forEach(cb=>{const i=+cb.dataset.i;cb.checked=checked.has(i);cb.closest('.pick').classList.toggle('on',cb.checked);
        cb.onchange=()=>{cb.checked?checked.add(i):checked.delete(i);cb.closest('.pick').classList.toggle('on',cb.checked);cnt()}});cnt();};
    draw();
    $('#i-smart').onchange=e=>{smart=e.target.checked;draw()};
    $('#i-cancel').onclick=closeSheet;
    $('#i-q').oninput=draw;
    $('#i-all').onchange=e=>{$$('#i-list [data-i]').forEach(cb=>{const i=+cb.dataset.i;e.target.checked?checked.add(i):checked.delete(i)});draw()};
    $('#i-ok').onclick=()=>{const pick=[...checked].map(i=>out(ok[i]));if(!pick.length){toast('추가할 고객을 골라 주세요');return}
      const tg=$('#i-tag').value.trim();closeSheet();addMany(pick,tg)};
  });
}

/* ================= 인사말 관리 ================= */
let tCat='월별 인사';
function renderTpl(){
  const cats=[['월별 인사','월별'],['명절','명절'],['생일','생일'],['결혼기념일','결혼기념일'],['감사','감사'],['위로·안내','위로·안내'],['mine','내가 만든']]
    .filter(([k])=>k==='mine'?S.templates.some(isMine):S.templates.some(t=>t.cat===k));
  if(!cats.some(([k])=>k===tCat))tCat=cats[0]?cats[0][0]:'월별 인사';
  $('#tCats').innerHTML=cats.map(([k,l])=>`<button class="chip" data-c="${k}" aria-pressed="${k===tCat}">${l}</button>`).join('');
  $$('#tCats .chip').forEach(b=>b.onclick=()=>{tCat=b.dataset.c;renderTpl()});
  const item=t=>`<div class="item" data-te="${t.id}" style="cursor:pointer"><div class="who"><b>${esc(t.name)}</b><div class="sub clamp">${esc(t.body)}</div></div><span class="sub" style="font-size:20px">›</span></div>`;
  let html='';
  if(tCat==='월별 인사'){const mN=monthNow();
    [...Array(12)].map((_,i)=>(mN-1+i)%12+1).forEach(m=>{const ts=S.templates.filter(t=>t.cat==='월별 인사'&&t.m===m);
      if(ts.length)html+=`<div class="grp">${m}월${m===mN?' · 이번 달':''}</div>`+ts.map(item).join('')});}
  else html=S.templates.filter(t=>tCat==='mine'?isMine(t):t.cat===tCat).map(item).join('');
  $('#tplList').innerHTML=html||'<div class="empty">인사말이 없어요</div>';
  $$('#tplList [data-te]').forEach(b=>b.onclick=()=>editTpl(S.templates.find(t=>t.id===b.dataset.te)));
}
$('#addTpl').onclick=()=>editTpl(null);
$('#restoreTpls').onclick=()=>{const have=new Set(S.templates.map(t=>t.id));let n=0;BASE_TPLS.forEach(t=>{if(!have.has(t.id)){S.templates.push({...t});n++}});save();renderTpl();toast(n?`기본 인사말 ${n}개를 다시 넣었어요`:'기본 인사말이 모두 있어요')};
function editTpl(t){
  const sample=S.customers[0]||{name:'홍길동',title:''};
  sheet(`<h3>${t?'인사말 고치기':'새 인사말'}</h3>
    <label class="f" for="t-name">제목</label><input type="text" id="t-name" value="${esc(t?.name)}" placeholder="예: 11월 · 첫눈">
    <label class="f" for="t-body">문구</label><textarea id="t-body">${esc(t?.body||'')}</textarea>
    <div class="row" style="margin-top:8px">${[['{이름}','+ 이름'],['{이름만}','+ 성 뺀 이름'],['{호칭}','+ 호칭'],['{월}','+ 이번 달']].map(([k,l])=>`<button class="chip" data-k="${k}">${l}</button>`).join('')}</div>
    <p class="note">고객 이름(맨 앞)과 내 이름(맨 끝)은 설정에 따라 자동으로 붙어요.</p>
    <label class="f">미리보기 (${esc(sample.name)} 님께 갈 때)</label><div class="msg" id="t-prev" style="max-height:none"></div>
    <div class="sheet-actions"><button class="btn big" id="t-cancel">취소</button><button class="btn big primary" id="t-save">저장하기</button></div>
    ${t?'<button class="btn big ghost danger" id="t-del" style="width:100%;margin-top:12px">🗑️ 이 인사말 삭제하기</button>':''}`,()=>{
    const body=$('#t-body');const prev=()=>$('#t-prev').textContent=fill(body.value,sample);prev();body.oninput=prev;
    $$('[data-k]').forEach(b=>b.onclick=()=>{const s=body.selectionStart??body.value.length,e=body.selectionEnd??s;
      body.value=body.value.slice(0,s)+b.dataset.k+body.value.slice(e);body.focus();body.selectionStart=body.selectionEnd=s+b.dataset.k.length;prev()});
    $('#t-cancel').onclick=closeSheet;
    if(t)$('#t-del').onclick=()=>confirmBox(`‘${esc(t.name)}’을 삭제할까요?`,'기본 인사말은 ‘기본 인사말 다시 넣기’로 되살릴 수 있어요.','네, 삭제할게요',
      ()=>{S.templates=S.templates.filter(x=>x.id!==t.id);save();render();toast('삭제했어요')},()=>editTpl(t));
    $('#t-save').onclick=()=>{const name=$('#t-name').value.trim()||'내 인사말',b=body.value.trim();if(!b){toast('문구를 적어 주세요');return}
      if(t)Object.assign(t,{name,body:b});else S.templates.push({id:uid(),name,cat:'내가 만든 인사말',body:b});
      save();closeSheet();if(!t)tCat='mine';render();toast('저장했어요')};
  });
}

/* ================= 업데이트 ================= */
const APP_VERSION='2.0.2';
const APP_NOTES=['보내는 순서를 바꿨어요: 받는 분 → 문구 → 보내기','오늘 생일·결혼기념일인 고객이 첫 화면 맨 위에 나와요','화면을 깔끔하게 정리하고 아이콘을 바꿨어요','연락처를 불러올 때 이름만 골라 저장해요','연락처를 다시 불러오면 새 사람만 보여 줘요 (갤럭시는 연락처에서 바로 고르기)'];
const newer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
$('#verNow').textContent='v'+APP_VERSION;
const online=/^https?:$/.test(location.protocol);
async function checkUpdate(manual){
  if(!online){if(manual)$('#verMsg').textContent='파일로 연 앱은 자동 업그레이드가 안 돼요. 웹 주소로 설치해 주세요.';return}
  if(manual)$('#verMsg').textContent='확인하는 중…';
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const v=await r.json();
    if(newer(v.version,APP_VERSION)){showUpd(v)}else if(manual){$('#verMsg').textContent='최신 버전을 쓰고 있어요';toast('최신 버전입니다')}}
  catch(e){if(manual)$('#verMsg').textContent='확인하지 못했어요. 인터넷 연결을 확인해 주세요.'}
}
function showUpd(v){
  $('#updBanner').innerHTML=`<div class="upd"><div><b>새 버전 v${esc(v.version)}</b>${v.notes?`<div style="font-size:13px;opacity:.9">${esc(v.notes)}</div>`:''}</div><button class="btn small" id="doUpd">업그레이드</button></div>`;
  $('#verMsg').textContent=`새 버전 v${v.version}이 있어요`;
  $('#doUpd').onclick=async()=>{save();toast('업그레이드 중… 고객 목록은 그대로 유지됩니다');
    try{await fetch(location.pathname,{cache:'reload'})}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(v.version))};
}
$('#checkUpd').onclick=()=>checkUpdate(true);

/* 문자·카톡 링크(?update)로 들어온 경우 */
const appUrl=location.origin+location.pathname;
const updUrl=appUrl+'?update';
const UA=navigator.userAgent;
const viaLink=online&&/[?&]update\b/.test(location.search);
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function linkSheet(title,body,btn){sheet(`<h3>${title}</h3><div class="note" style="font-size:15px;color:var(--fg);line-height:1.7">${body}</div>
  <div class="row" style="justify-content:flex-end;margin-top:14px">${btn||''}<button class="btn primary" id="ls-ok">확인</button></div>`,()=>{$('#ls-ok').onclick=closeSheet});}
async function handleUpdateLink(){
  if(history.replaceState)history.replaceState(null,'',location.pathname);
  if(/KAKAOTALK/i.test(UA)){
    location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(updUrl);
    linkSheet('브라우저로 여는 중이에요','카카오톡 안에서는 고객 목록이 보이지 않아서 휴대폰 브라우저로 다시 엽니다.<br>자동으로 넘어가지 않으면 오른쪽 위(또는 아래) <b>⋮ → ‘다른 브라우저로 열기’</b>를 눌러 주세요.');return;}
  if(/Android/i.test(UA)&&/SamsungBrowser|NAVER|Line\/|Instagram|FB_IAB|DaumApps|; wv\)/i.test(UA)){
    location.href=`intent://${location.host}${location.pathname}?update#Intent;scheme=https;package=com.android.chrome;end`;
    linkSheet('크롬으로 여는 중이에요','마음안부는 크롬에 설치되어 있어서 크롬으로 다시 엽니다.<br>넘어가지 않으면 홈 화면의 <b>마음안부</b> 아이콘을 눌러 주세요. 열면 새 버전이 적용돼 있어요.');return;}
  if(isIOS&&!standalone){
    linkSheet('홈 화면의 마음안부를 열어 주세요','아이폰은 홈 화면 아이콘으로 열어야 고객 목록이 보여요.<br>이 화면을 닫고 홈 화면의 <b>마음안부</b> 아이콘을 누르면 새 버전이 바로 적용됩니다.');return;}
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const v=await r.json();
    if(newer(v.version,APP_VERSION)){toast('새 버전을 받는 중…');try{await fetch(location.pathname,{cache:'reload'})}catch(e){}
      location.replace(location.pathname+'?v='+encodeURIComponent(v.version));return;}
    linkSheet('업그레이드 완료',`최신 버전 <b>v${esc(APP_VERSION)}</b>을 쓰고 있어요.${v.notes?`<br>${esc(v.notes)}`:''}<br>고객 목록과 인사말은 그대로 있습니다.`);
  }catch(e){toast('업데이트를 확인하지 못했어요. 인터넷 연결을 확인해 주세요')}
}
if(viaLink)handleUpdateLink();else checkUpdate(false);

    const t=`[마음안부] 새 버전 v${v.version}이 나왔어요.${v.notes?`\n· ${v.notes}`:''}\n\n아래 링크를 누르면 바로 업그레이드됩니다.\n${updUrl}\n\n※ 아이폰은 링크를 연 뒤 홈 화면의 마음안부 아이콘을 눌러 주세요.`;
    $('#noticeText').textContent=t;$('#noticeSms').href=isIOS?`sms:&body=${encodeURIComponent(t)}`:`sms:?body=${encodeURIComponent(t)}`;return t;};
  makeNotice();$('#noticeCopy').onclick=()=>copy($('#noticeText').textContent,'안내 문구를 복사했어요');}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});

 <p>고객 목록이 안 보여요</p><div>홈 화면의 마음안부 아이콘으로 열었는지 확인하세요. 카톡이나 다른 브라우저로 열면 목록이 안 보여요. 그래도 없으면 설정 → 백업으로 되살리기를 쓰세요.</div>
 <p>같은 분께 다시 보내고 싶어요</p><div>보내기 화면 목록에서 그분 옆 ‘다시’를 누르세요.</div>

  ${['send1','send2','send3','cust','tpl','set'].map((k,i)=>`<details ${i===0?'open':''}><summary>${HELP[k].t}</summary><div class="body">${HELP[k].h}</div></details>`).join('')}
  <details><summary>자주 묻는 질문</summary><div class="body">${FAQ}</div></details>`;}
function showHelp(k){sheet(`<h3 style="margin-bottom:14px">${HELP[k].t}</h3>${HELP[k].h}
  <div class="sheet-actions"><button class="btn big" id="h-all">전체 안내</button><button class="btn big primary" id="h-ok">알겠어요</button></div>`,()=>{
  $('#h-ok').onclick=closeSheet;$('#h-all').onclick=()=>{closeSheet();tab='help';render();window.scrollTo(0,0)}});}
$('#helpBtn').onclick=()=>showHelp(tab==='send'?'send'+S.flow.step:tab==='help'?'send1':tab);

/* ================= 화면 그리기 ================= */
function render(){
  $$('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  ['send','cust','tpl','set','help'].forEach(k=>$('#p-'+k).hidden=k!==tab);
  if(tab==='send')renderSend();if(tab==='cust')renderCust();if(tab==='tpl')renderTpl();if(tab==='help')renderGuide();
}

  if(wasUser)setTimeout(()=>sheet(`<div style="text-align:center;padding:6px 0"><div style="font-size:40px;line-height:1">🎉</div>

    <p class="note" style="font-size:15px;margin:0">${prev?`v${esc(prev)} → `:''}<b style="color:var(--accent)">v${APP_VERSION}</b></p></div>
    <ul style="margin:14px 0;padding-left:20px;font-size:16px;line-height:1.8">${APP_NOTES.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
    <p class="note" style="margin:0 0 14px">고객 목록과 인사말은 그대로 있어요.</p>
    <button class="btn big primary" style="width:100%" id="upd-ok">확인</button>`,()=>{$('#upd-ok').onclick=closeSheet}),400);}
if(!S.welcomed){S.welcomed=true;save();setTimeout(()=>sheet(`<div class="hero" style="margin-bottom:16px"><h3>마음안부에 오신 걸 환영해요</h3><p>고객 이름이 들어간 안부 문자를 한 명씩 쉽게 보내는 앱이에요.</p></div>
  <ol class="steps"><li><div><b>설정</b>에서 내 이름을 적어요</div></li><li><div><b>고객</b>에서 고객을 넣어요</div></li><li><div><b>보내기</b>에서 받는 분 → 문구 → 보내기 순서로 눌러요</div></li></ol>
  <p class="note">지금 보이는 김민수·이영희·박준호는 연습용 예시예요. 설정에서 지울 수 있어요.</p>
  <button class="btn big primary" style="width:100%;margin-top:8px" id="w-ok">시작하기</button>`,()=>{$('#w-ok').onclick=closeSheet}),400)}
